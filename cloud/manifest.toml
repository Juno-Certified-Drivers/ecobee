[driver]
id = "ecobee.thermostat"
name = "Ecobee Thermostat"
manufacturer = "Ecobee"
version = "1.0.0"
runtime = "native"

[[proxy]]
id = 1
type = "thermostat"
primary = true
name = "Thermostat"
capabilities = { has_heat = true, has_cool = true, has_auto = true, has_fan_control = true, fan_modes = ["auto", "on"], has_humidity = true, has_hold = true, setpoint_min_c = 7.0, setpoint_max_c = 32.0, setpoint_step_c = 0.5, stage_count = 2 }

# The thermostat's own built-in sensors, as separate bindings. One binding per measured
# quantity so an automation can trigger on occupancy alone without also seeing temperature.
[[proxy]]
id = 2
type = "sensor"
name = "Occupancy"
capabilities = { kind = "occupancy", is_boolean = true, auto_clear_seconds = 1800 }

[[proxy]]
id = 3
type = "sensor"
name = "Temperature"
capabilities = { kind = "temperature", unit = "°C", value_min = -20.0, value_max = 50.0 }

[[transport]]
kind = "network"
port = 443

[[property]]
name = "API key"
type = "password"
tooltip = "Ecobee developer API key"

[[property]]
name = "Refresh token"
type = "password"
tooltip = "Obtained once through the ecobee PIN authorization flow"

[[property]]
name = "Thermostat identifier"
type = "string"
tooltip = "The thermostat's serial number, as reported by the ecobee API"

[[property]]
name = "Poll interval"
type = "ranged_int"
min = 60
max = 900
default = 180
unit = "s"
tooltip = "Ecobee rate-limits polling; below 3 minutes risks being throttled"

[discovery]
mac_oui = ["44:61:32"]
