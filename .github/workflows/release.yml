# Push to main for a beta, tag v1.2.3 for a release. Everything else is inherited.
#
# Two packages: the cloud API and the HomeKit path. They are released together because they
# share a version and a repo, but they ship as separate artifacts.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  driver:
    uses: junohouse/driver-ci/.github/workflows/driver.yml@v1
    with:
      packages: '["cloud", "hap"]'
    secrets: inherit
